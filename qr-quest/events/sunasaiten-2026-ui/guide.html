<!doctype html>
<html lang="ja">
<head>
  <script src="time-gate.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>開催要項 | QRクエスト in 2026吹上浜砂の祭典</title>
  <style>
    :root{
      --bg:#f7fbff;
      --ink:#222;
      --line:#e6eef7;
      --brand:#1e88e5;
    }
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      background:var(--bg);
      color:var(--ink);
    }
    header{
      padding:14px 14px 10px;
      text-align:center;
    }
    h1{
      font-size:20px;
      margin:6px 0 4px;
    }
    p{
      margin:0 0 10px;
      font-size:13px;
      color:#444;
      line-height:1.6;
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:0 12px 88px;
    }
    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px;
      margin:10px 0;
    }
    img{
      width:100%;
      height:auto;
      border-radius:12px;
      display:block;
    }
    .hint{
      font-size:12px;
      color:#555;
      margin-top:8px;
      line-height:1.6;
    }
    .btns{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(6px);
      border-top:1px solid var(--line);
      padding:10px 12px;
    }
    .row{
      max-width:980px;
      margin:0 auto;
      display:flex;
      gap:10px;
    }
    a.btn{
      flex:1;
      display:block;
      text-align:center;
      padding:14px 12px;
      border-radius:14px;
      text-decoration:none;
      font-weight:800;
      border:1px solid var(--brand);
      background:var(--brand);
      color:#fff;
    }
    a.btn.sub{
      background:#fff;
      color:var(--brand);
    }
  </style>
<script src="./time-window.js"></script>
</head>
<body>
  <header>
    <h1>開催要項</h1>
    <p>景品や参加方法などを確認できます。<br>※ピンチ（2本指）で拡大できます。</p>
  </header>

  <div class="wrap">
    <div class="card">
      <img src="images/event_guide_front.jpeg" alt="開催要項" onerror="this.style.display='none'; document.getElementById('noimg').style.display='block';" />
      <div id="noimg" class="hint" style="display:none;">
        開催要項の画像がまだありません。<br>
        <strong>images/event_guide_front.jpeg</strong> をここに置くと表示されます。
      </div>
      <div class="hint">内容をよく確認してからご参加ください。</div>
    </div>
  </div>

  <div class="btns">
    <div class="row">
      <a class="btn sub" href="howto.html">⬅ 戻る</a>
      <a class="btn" href="index.html">🏠 ホームへ</a>
    </div>
  </div>
</body>
</html>
